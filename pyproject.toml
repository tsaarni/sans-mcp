[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sans-mcp"
version = "0.1.0"
description = "Dynamic Python client and HTTP proxy for MCP servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sans-mcp = "sans_mcp:main"

[tool.hatch.build.targets.wheel]
include = ["sans_mcp.py"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
    "PIE",  # flake8-pie
]
ignore = [
    "E501", # line-too-long (handled by formatter)
]
